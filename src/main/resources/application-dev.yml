# Postgres / Supabase — requires GOVIEW_DB_* env vars (see .env + run-dev.ps1).
# Plain `mvnd spring-boot:run` without env will fail fast instead of hitting localhost.
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${GOVIEW_DB_URL}
    username: ${GOVIEW_DB_USER}
    password: ${GOVIEW_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
