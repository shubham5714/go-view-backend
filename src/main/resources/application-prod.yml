# Production — Supabase Transaction pooler (same as dev).
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${GOVIEW_DB_URL}
    username: ${GOVIEW_DB_USER}
    password: ${GOVIEW_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 180000
      idle-timeout: 60000
      keepalive-time: 30000
      pool-name: GoviewHikariPool
