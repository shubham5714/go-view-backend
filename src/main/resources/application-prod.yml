# Production profile — same env-driven Postgres as dev
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${GOVIEW_DB_URL}
    username: ${GOVIEW_DB_USER}
    password: ${GOVIEW_DB_PASSWORD}
    druid:
      initial-size: 5
      max-active: 50
      min-idle: 5
      max-wait: 60000
      validation-query: SELECT 1
